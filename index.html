<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Analytics Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #FDF8F5;
            padding: 40px 20px;
            color: #2C3E50;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #5B4AFF; 
            font-size: 2.2rem;
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .controls input {
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            font-size: 16px;
            width: 280px;
            outline: none;
            background: rgba(91, 74, 255, 0.15); 
            backdrop-filter: blur(6px);
            color: #333;
            box-shadow: 0 4px 15px rgba(91, 74, 255, 0.1);
        }
        .controls input::placeholder { color: #5B4AFF; opacity: 0.7; }
        .controls input:focus {
            background: rgba(91, 74, 255, 0.25);
            box-shadow: 0 4px 20px rgba(91, 74, 255, 0.2);
        }
        
        .controls select {
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid #ddd;
            font-size: 16px;
            width: 220px;
            outline: none;
            background: #fff;
            cursor: pointer;
        }
        
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px; 
        }

        .user-card {
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(91, 74, 255, 0.15); 
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .user-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 35px rgba(91, 74, 255, 0.25);
        }
        
        .card-header {
            background: #8A7EFF; 
            padding: 18px 20px;
            color: white;
        }
        .card-header h3 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .card-body .email {
            font-size: 14px;
            color: #5e5e5e;
            margin-bottom: 15px;
        }
        
        .user-stats {
            display: flex;
            justify-content: space-around;
            margin: 12px 0 18px 0;
            padding: 12px 0;
            border-top: 1px solid #f0f0f0;
            border-bottom: 1px solid #f0f0f0;
        }
        .user-stats div { text-align: center; }
        .user-stats span {
            display: block;
            font-weight: bold;
            font-size: 1.1rem;
            color: #5B4AFF;
        }
        .user-stats small {
            font-size: 12px;
            color: #777;
        }

        .details-btn {
            background-color: #5B4AFF;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            align-self: flex-end;
            margin-top: auto; 
            transition: background 0.2s, transform 0.2s;
        }
        .details-btn:hover {
            background-color: #4436cc;
            transform: scale(1.02);
        }

        .loading, .error {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 18px;
            padding: 40px;
            color: #777;
        }
        .error { color: #e74c3c; font-weight: bold; }
        
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal.hidden { display: none; }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .close-btn {
            position: absolute; top: 15px; right: 20px;
            font-size: 28px; cursor: pointer; color: #aaa;
        }
        .close-btn:hover { color: #333; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1> User Analytics</h1>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder=" Search users ...">
            <select id="sortSelect">
                <option value="name">Sort: Name A-Z</option>
                <option value="posts">Sort: Most Posts</option>
                <option value="comments">Sort: Most Comments</option>
            </select>
        </div>

        <div id="usersContainer" class="users-grid">
            <div id="loadingMessage" class="loading"> Loading dashboard data...</div>
        </div>
        
        <div id="userDetailsModal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn" onclick="closeDetails()">&times;</span>
                <h2 id="modalName">--</h2>
                <div id="modalBody">--</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
