<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Analytics Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #F9F6F0;
            padding: 40px 20px;
            color: #333;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #5B4AFF;
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .controls input, .controls select {
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(91, 74, 255, 0.3);
            font-size: 16px;
            width: 250px;
            outline: none;
            background: rgba(91, 74, 255, 0.08);
            backdrop-filter: blur(8px);
            color: #2C3E50;
            transition: all 0.3s ease;
        }

        .controls input::placeholder {
            color: #7B6FFF;
            opacity: 0.7;
        }

        .controls input:focus, .controls select:focus {
            background: rgba(91, 74, 255, 0.15);
            border-color: #5B4AFF;
            box-shadow: 0 0 15px rgba(91, 74, 255, 0.15);
        }

        .controls select option {
            background: #FFF;
            color: #333;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .user-card {
            background: #FFFFFF;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(91, 74, 255, 0.08);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(91, 74, 255, 0.15);
        }

        .user-card h3 {
            color: #1A1A1A;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .user-card .email {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .user-stats {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #F0F0F0;
            border-bottom: 1px solid #F0F0F0;
            margin-bottom: 15px;
        }

        .user-stats div { text-align: center; }
        .user-stats span {
            display: block;
            font-weight: 600;
            font-size: 1.2rem;
            color: #5B4AFF;
        }
        .user-stats small { font-size: 13px; color: #888; }

        .details-btn {
            background-color: #5B4AFF;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            align-self: flex-end;
            font-weight: 500;
            transition: 0.3s;
        }

        .details-btn:hover {
            background-color: #4436cc;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(91, 74, 255, 0.3);
        }

        .loading, .error {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 18px;
            padding: 40px;
            color: #888;
        }
        .error { color: #e74c3c; font-weight: bold; }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal.hidden { display: none; }

        .modal-content {
            background: #FFFFFF;
            padding: 30px;
            border-radius: 16px;
            max-width: 450px;
            width: 90%;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .modal-content h2 {
            color: #5B4AFF;
            margin-bottom: 15px;
        }

        .modal-content p {
            margin: 8px 0;
            color: #444;
        }

        .close-btn {
            position: absolute; top: 15px; right: 20px;
            font-size: 24px; cursor: pointer; color: #888;
            transition: 0.3s;
        }
        .close-btn:hover { color: #333; transform: rotate(90deg); }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1> User Analytics</h1>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search users...">
            <select id="sortSelect">
                <option value="name">Sort: Name A-Z</option>
                <option value="posts">Sort: Most Posts</option>
                <option value="comments">Sort: Most Comments</option>
            </select>
        </div>

        <div id="usersContainer" class="users-grid">
            <div id="loadingMessage" class="loading"> Loading dashboard data...</div>
        </div>
        
        <div id="userDetailsModal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn" onclick="closeDetails()">&times;</span>
                <h2 id="modalName">--</h2>
                <div id="modalBody">--</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
