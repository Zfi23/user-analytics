<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Analytics Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* تدرج لوني ساحر من البنفسجي العميق إلى الأزرق السماوي */
            background: linear-gradient(135deg, #0F0C29 0%, #302B63 50%, #24243E 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #ffffff; /* تغيير اللون العام للنص للأبيض */
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffffff;
            font-size: 2.5rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .controls input, .controls select {
            padding: 12px 18px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            width: 250px;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .controls input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .controls input:focus, .controls select:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #8A2BE2;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.3);
        }

        .controls select option {
            color: #333;
            background: #fff;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(138, 43, 226, 0.3);
            border-color: rgba(138, 43, 226, 0.5);
        }

        .user-card h3 { 
            margin-bottom: 5px; 
            color: #ffffff;
            font-size: 1.3rem;
        }

        .user-card .email { 
            font-size: 14px; 
            color: rgba(255, 255, 255, 0.7); 
            margin-bottom: 15px; 
        }

        .user-stats {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-stats div { text-align: center; }
        
        .user-stats span { 
            display: block; 
            font-weight: bold; 
            color: #8A2BE2; /* اللون البنفسجي المشرق للأرقام */
        }
        
        .user-stats small { 
            font-size: 12px; 
            color: rgba(255, 255, 255, 0.6); 
        }

        .details-btn {
            background: linear-gradient(135deg, #8A2BE2, #4B0082);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            align-self: flex-end;
            margin-top: 10px;
            transition: 0.3s;
            font-weight: bold;
        }

        .details-btn:hover { 
            transform: scale(1.05); 
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
        }

        .loading, .error {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 18px;
            padding: 40px;
            color: rgba(255, 255, 255, 0.8);
        }

        .error { 
            color: #ff6b6b; 
            font-weight: bold; 
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal.hidden { display: none; }

        .modal-content {
            background: #1A1A2E;
            padding: 30px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            position: relative;
            border: 1px solid rgba(138, 43, 226, 0.3);
            color: #ffffff;
        }

        .close-btn {
            position: absolute; top: 15px; right: 20px;
            font-size: 28px; cursor: pointer; color: rgba(255,255,255,0.5);
            transition: 0.3s;
        }
        .close-btn:hover { color: #ffffff; transform: rotate(90deg); }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>✨ User Analytics Dashboard</h1>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search users by name or email...">
            <select id="sortSelect">
                <option value="name">Sort by: Name (A-Z)</option>
                <option value="posts">Sort by: Most Posts</option>
                <option value="comments">Sort by: Most Comments</option>
            </select>
        </div>

        <div id="usersContainer" class="users-grid">
            <div id="loadingMessage" class="loading">⏳ Loading dashboard data...</div>
        </div>
        
        <div id="userDetailsModal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn" onclick="closeDetails()">&times;</span>
                <h2 id="modalName">--</h2>
                <div id="modalBody">--</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
