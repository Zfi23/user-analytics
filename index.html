<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Analytics Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            padding: 40px 20px;
            color: #333;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .controls input, .controls select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            width: 250px;
            outline: none;
        }

        .controls input:focus, .controls select:focus {
            border-color: #3498db;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .user-card:hover {
            transform: translateY(-5px);
        }

        .user-card h3 { margin-bottom: 5px; color: #2c3e50; }
        .user-card .email { font-size: 14px; color: #7f8c8d; margin-bottom: 15px; }

        .user-stats {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            padding: 10px 0;
            border-top: 1px solid #ecf0f1;
            border-bottom: 1px solid #ecf0f1;
        }

        .user-stats div { text-align: center; }
        .user-stats span { display: block; font-weight: bold; color: #3498db; }
        .user-stats small { font-size: 12px; color: #7f8c8d; }

        .details-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            align-self: flex-end;
            margin-top: 10px;
        }

        .details-btn:hover { background-color: #2980b9; }

        .loading, .error {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 18px;
            padding: 40px;
            color: #7f8c8d;
        }
        .error { color: #e74c3c; font-weight: bold; }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal.hidden { display: none; }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        .close-btn {
            position: absolute; top: 15px; right: 20px;
            font-size: 28px; cursor: pointer; color: #aaa;
        }
        .close-btn:hover { color: #333; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1> User Analytics Dashboard</h1>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search users by name or email...">
            <select id="sortSelect">
                <option value="name">Sort by: Name (A-Z)</option>
                <option value="posts">Sort by: Most Posts</option>
                <option value="comments">Sort by: Most Comments</option>
            </select>
        </div>

        <div id="usersContainer" class="users-grid">
            <div id="loadingMessage" class="loading"> Loading dashboard data ...</div>
        </div>
        
        <div id="userDetailsModal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn" onclick="closeDetails()">&times;</span>
                <h2 id="modalName">--</h2>
                <div id="modalBody">--</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
